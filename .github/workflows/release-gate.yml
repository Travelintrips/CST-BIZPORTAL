name: Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DATABASE_URL_DEV: postgresql://ci:ci@127.0.0.1:65432/ci
      SUPABASE_PG_URL: postgresql://ci:ci@127.0.0.1:65432/ci
      APP_ENV: development
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API tests
        run: pnpm --filter @workspace/api-server test

      - name: BizPortal tests
        run: pnpm --filter @workspace/bizportal test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Production runtime smoke
        shell: bash
        env:
          NODE_ENV: production
          APP_ENV: production
          PORT: "3000"
          SUPABASE_DATABASE_URL: postgresql://postgres.nzdweipzckfszczzqtuw:ci@127.0.0.1:65432/ci
          SUPABASE_DATABASE_URL_DEV: ""
          SUPABASE_PG_URL: ""
          GCP_SECRET_MANAGER_BOOTSTRAP_JSON: ""
        run: |
          set -euo pipefail
          test -f ./index.js
          test -f ./dist/index.js
          test -f ./dist/index.mjs
          node --max-http-header-size=65536 --enable-source-maps ./index.js > /tmp/bizportal-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/bizportal-runtime.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/api/health/live | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/bizportal-runtime.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/ >/dev/null

          # An unauthed Payroll request must reach the real Payroll router
          # and fail closed (401), never fall through to standalone 404.
          # This catches builds that serve frontend/health but omit Payroll.
          for route in /api/payroll/runs?companyId=1 /api/payroll/capabilities?companyId=1; do
            status=$(curl -sS --max-time 5 -o /tmp/payroll-route-smoke-body -w '%{http_code}' "http://127.0.0.1:3000$route")
            if [ "$status" != "401" ]; then
              echo "PAYROLL_ROUTE_SMOKE_FAIL: $route returned $status, expected 401"
              cat /tmp/payroll-route-smoke-body
              exit 1
            fi
          done
          echo "PAYROLL_ROUTE_SMOKE_PASS"
          cat /tmp/bizportal-runtime.log
