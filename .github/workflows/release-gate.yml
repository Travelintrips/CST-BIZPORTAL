name: Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DATABASE_URL_DEV: postgresql://ci:ci@127.0.0.1:65432/ci
      SUPABASE_PG_URL: postgresql://ci:ci@127.0.0.1:65432/ci
      APP_ENV: development
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API tests
        run: pnpm --filter @workspace/api-server test

      - name: BizPortal tests
        run: pnpm --filter @workspace/bizportal test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Validate the bundled web server in DEV context only. No PROD keys or URLs
      # are loaded; the health endpoint must work with a non-connected local DB.
      - name: Isolated DEV runtime smoke
        shell: bash
        env:
          NODE_ENV: development
          APP_ENV: development
          PORT: "3000"
          SUPABASE_DATABASE_URL: ""
          SUPABASE_DATABASE_URL_DEV: postgresql://ci:ci@127.0.0.1:65432/ci
          SUPABASE_PG_URL: postgresql://ci:ci@127.0.0.1:65432/ci
          GCP_SECRET_MANAGER_BOOTSTRAP_JSON: ""
        run: |
          set -euo pipefail
          test -f ./index.js
          test -f ./dist/index.js
          test -f ./dist/index.mjs
          node --max-http-header-size=65536 --enable-source-maps ./index.js > /tmp/bizportal-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/bizportal-runtime.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/api/health/live | grep -q '"status":"ok"'; then
              curl -fsS http://127.0.0.1:3000/ >/dev/null
              echo "DEV_RUNTIME_SMOKE=PASS"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bizportal-runtime.log
          echo "::error::DEV runtime smoke failed"
          exit 1
