kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--dir", ".upstream-cst-super-app/artifacts/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
APP_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", ".upstream-cst-super-app/artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
APP_ENV = "production"

[services.production.health.startup]
path = "/api/health/ready"
