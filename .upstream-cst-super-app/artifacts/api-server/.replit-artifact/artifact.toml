kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 18444
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash start-dev.sh"

[services.development.env]
PORT = "18444"
NODE_ENV = "development"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [
  "node",
  "artifacts/api-server/load-secrets.mjs",
  "node",
  "--enable-source-maps",
  "artifacts/api-server/dist/index.mjs",
]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
APP_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"