          <section>
            <h2>Solusi Logistik Terpadu untuk Bisnis Anda</h2>
            <p>
              B2B Marketplace and Logistic adalah perusahaan logistik terkemuka di Indonesia yang menyediakan layanan ekspor impor,
              freight forwarding udara dan laut, customs clearance (PPJK), serta solusi logistik terintegrasi untuk
              bisnis dari berbagai skala. Dengan pengalaman bertahun-tahun dan jaringan mitra global yang luas,
              kami berkomitmen menghadirkan layanan pengiriman yang cepat, aman, dan terpercaya.
            </p>
            <p>
              Kami melayani ribuan pelaku bisnis di seluruh Indonesia — dari UMKM yang baru memulai ekspor pertama
              mereka, hingga perusahaan multinasional yang membutuhkan solusi logistik kompleks. Kepercayaan lebih
              dari 500 perusahaan menjadi bukti komitmen kami terhadap kualitas dan keandalan layanan.
            </p>
          </section>

          <section>
            <h2>Layanan Unggulan B2B Marketplace and Logistic</h2>

            <h3>Ekspor Impor</h3>
            <p>
              Kami membantu bisnis Anda menembus pasar global dengan layanan ekspor impor yang komprehensif.
              Tim ahli kami menangani seluruh proses — dari pengurusan dokumen, koordinasi pengiriman, hingga
              penyelesaian bea cukai — sehingga Anda bisa fokus pada pengembangan bisnis.
            </p>

            <h3>Freight Forwarding Udara (Air Freight)</h3>
            <p>
              Layanan pengiriman udara internasional dengan jaringan maskapai terkemuka di seluruh dunia.
              Cocok untuk kargo yang memerlukan kecepatan pengiriman tinggi atau barang bernilai tinggi.
              Estimasi transit 1–5 hari ke seluruh destinasi utama dunia.
            </p>

            <h3>Freight Forwarding Laut (Sea Freight / Ocean Freight)</h3>
            <p>
              Solusi pengiriman laut dengan pilihan FCL (Full Container Load) dan LCL (Less than Container Load).
              Kami memiliki jadwal keberangkatan reguler ke lebih dari 150 pelabuhan di seluruh dunia dengan
              harga yang kompetitif dan waktu pengiriman yang terjadwal dengan baik.
            </p>

            <h3>Customs Clearance (PPJK &amp; Kepabeanan)</h3>
            <p>
              Tim kepabeanan berpengalaman kami siap membantu pengurusan dokumen bea cukai, klasifikasi
              HS Code, penghitungan bea masuk dan pajak impor, serta koordinasi dengan Direktorat Jenderal
              Bea dan Cukai. Kami terdaftar sebagai Pengusaha Pengurusan Jasa Kepabeanan (PPJK) resmi.
            </p>

            <h3>Trucking &amp; Distribusi Domestik</h3>
            <p>
              Layanan trucking dan distribusi darat di seluruh Indonesia. Armada kendaraan modern dengan
              sistem pelacakan real-time memastikan kargo Anda tiba tepat waktu dan dalam kondisi sempurna.
            </p>

            <h3>Pergudangan &amp; Fulfillment</h3>
            <p>
              Fasilitas gudang strategis di Jakarta dan kota-kota besar lainnya dengan sistem manajemen
              inventaris digital. Ideal untuk bisnis e-commerce yang membutuhkan solusi fulfillment terintegrasi.
            </p>
          </section>

          <section>
            <h2>Mengapa Memilih B2B Marketplace and Logistic?</h2>
            <ul>
              <li>Lebih dari 500 perusahaan telah mempercayakan logistik mereka kepada kami</li>
              <li>Jaringan agen dan mitra di lebih dari 100 negara</li>
              <li>Platform digital terintegrasi untuk booking, tracking, dan manajemen dokumen</li>
              <li>Tim customer service siap membantu 24/7 via WhatsApp dan email</li>
              <li>Asuransi kargo tersedia untuk perlindungan penuh pengiriman Anda</li>
              <li>Harga transparan dan kompetitif dengan kalkulator biaya online</li>
              <li>Proses kepabeanan yang cepat dan terpercaya dengan tingkat clearance tinggi</li>
              <li>Laporan dan dokumentasi pengiriman yang lengkap dan mudah diakses</li>
            </ul>
          </section>

          <section>
            <h2>Kalkulator Biaya Pengiriman</h2>
            <p>
              Gunakan <a href="/calculator">kalkulator biaya pengiriman</a> kami untuk mendapatkan estimasi
              harga freight forwarding udara maupun laut secara instan. Masukkan detail kargo — berat, dimensi,
              asal, dan tujuan — dan dapatkan penawaran langsung dari sistem kami.
            </p>
          </section>

          <section>
            <h2>Lacak Pengiriman Anda</h2>
            <p>
              Pantau status pengiriman Anda secara real-time melalui <a href="/track">halaman pelacakan</a> kami.
              Masukkan nomor order atau nomor resi untuk melihat posisi dan status terkini kargo Anda di mana pun
              Anda berada.
            </p>
          </section>

          <section>
            <h2>Hubungi Kami</h2>
            <p>
              Kami siap membantu Anda menemukan solusi logistik terbaik untuk kebutuhan bisnis Anda.
              Hubungi tim kami melalui:
            </p>
            <ul>
              <li>Website: <a href="/contact">Formulir Kontak Online</a></li>
              <li>Email: info@cstlogistic.co.id</li>
              <li>WhatsApp: Tersedia di halaman <a href="/contact">Kontak</a></li>
              <li>Kantor: Jakarta, Indonesia</li>
            </ul>
            <p>
              Untuk informasi lengkap mengenai layanan, harga, dan prosedur pengiriman, silakan kunjungi
              halaman <a href="/services">Layanan</a> kami atau <a href="/register">daftar sebagai member</a>
              untuk akses penuh ke platform logistik digital kami.
            </p>
          </section>

    <!-- Inline error trap: runs synchronously before ANY module loads.

            el.innerHTML =

              + String(msg).replace(/</g,'&lt;').replace(/>/g,'&gt;')
              + '</div>';
          }
        } catch(e2) { /* ignore */ }
      }
      window.addEventListener('error', function (e) {
        showErr((e.error && e.error.stack) ? e.error.stack : (e.message + '\n' + e.filename + ':' + e.lineno));
      });
      window.addEventListener('unhandledrejection', function (e) {
        showErr('UnhandledRejection: ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
      });
    })();
    </script>
