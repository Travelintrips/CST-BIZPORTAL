kind = "web"
previewPath = "/"
title = "Customer Portal — Website Publik"
version = "1.0.0"
id = "artifacts/customer-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23434

[services.development]
run = "bash start-dev.sh"

[services.production]
build = [ "pnpm", "--filter", "@workspace/customer-portal", "run", "build" ]
publicDir = "artifacts/customer-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/services/"
to = "/services/index.html"

